name: Insights Background Sync Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tichess background sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TICHESS_URL: ${{ vars.TICHESS_URL || 'https://tichess.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set; skipping GitHub Actions cron (Vercel daily cron still runs automatically)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TICHESS_URL%/}/api/insights/cron"
          echo ""
